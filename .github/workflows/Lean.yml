#=================================================
# Description: Build OpenWrt using GitHub Actions
# Lisence: MIT
# Author: xiaowalu
#=================================================

name: Lean

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '是否进入 SSH 远程配置终端？选择 true 进入，false 跳过'
        required: true
        type: choice
        options:
          - 'false'
          - 'true'
        default: 'false'

env:
  TZ: Asia/Shanghai

jobs:
  merge:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id

    name: Build ${{matrix.target}}
    strategy:
      fail-fast: false
      matrix:
        target: [Lean]
    
    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 释放磁盘空间
      uses: coder-xiaomo/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true       

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync swig unzip zlib1g-dev file wget \
        llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
        libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
        sudo apt-get autoremove -y --purge
        sudo apt-get clean
        
    - name: 获取当前日期
      run: |
        echo "date=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
        echo "date2=$(date +'%m/%d %Y')" >> $GITHUB_ENV
        echo "VERSION=$(date +'%m.%d')" >> $GITHUB_ENV
        
    - name: 克隆源码
      env: 
        REPO_URL: https://github.com/coolsnowwolf/lede
        REPO_BRANCH: master
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        
        echo "========== LEDE source =========="
        git log -1 --oneline

        sed -i '$a src-git smpackage https://github.com/kenzok8/small-package' feeds.conf.default

    - name: 配置编译磁盘空间
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo mkdir -p -m 777 /mnt/openwrt/dl /mnt/openwrt/bin /mnt/openwrt/staging_dir
        sudo chown -R $USER:$USER /mnt/openwrt
        ln -sf /mnt/openwrt/dl openwrt/dl
        ln -sf /mnt/openwrt/bin openwrt/bin
        ln -sf /mnt/openwrt/staging_dir openwrt/staging_dir

    - name: 更新 feeds
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        
        echo "========== packages feed =========="
        git -C feeds/packages log -1 --oneline
        echo "========== luci feed =========="
        git -C feeds/luci log -1 --oneline
        echo "========== 检查关键依赖 =========="
        [ -d feeds/luci/modules/luci-mod-network ] \
          && echo "[PASS] luci-mod-network exists" \
          || echo "[FAIL] luci-mod-network missing"

        find feeds/packages -type d -name 'pciids' -print | head

    - name: 生成编译配置 ${{matrix.target}}
      env:
        CONFIG_FILE: 'configs/${{matrix.target}}.config'
      run: |
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "[ERROR] 找不到配置文件：$CONFIG_FILE"
          exit 1
        fi
        cp "$CONFIG_FILE" openwrt/.config
        chmod +x ./customize.sh && ./customize.sh
        cd openwrt

        echo "========== 99-default_network 完整内容 =========="
        cat package/base-files/files/etc/board.d/99-default_network

        echo "========== 检查 x86 网络初始化 =========="
        grep -n -A20 -B5 'qemu-standard-pc\|ucidef_set_interfaces_lan_wan' \
            target/linux/x86/base-files/etc/board.d/02_network || true

        echo "========== 检查默认网络生成 =========="
        grep -n -E 'eth0|eth1|eth2|eth3|lan|wan|br-lan' \
            package/base-files/files/bin/config_generate | head -100 || true

        echo "========== 检查网络初始化脚本 =========="
        grep -RniE 'eth0|eth1|eth2|eth3' \
            target/linux/x86/base-files package/base-files/files 2>/dev/null | head -100 || true
        
        rm -rf feeds/luci/applications/luci-app-openclash
        cp -f feeds/smpackage/.github/diy/default-settings package/lean/default-settings/files/zzz-default-settings
        sed -i 's/by kenzo/by xiaowalu/g' package/lean/default-settings/files/zzz-default-settings
        sed -i 's/kenzo_build/czjesda_build/g' package/lean/default-settings/files/zzz-default-settings
        sed -i '/kenzo_date=/a\. /etc/openwrt_release' package/lean/default-settings/files/zzz-default-settings
        sed -i '/\. \/etc\/openwrt_release/a\sed -i "s|^OPENWRT_RELEASE=.*|OPENWRT_RELEASE=\\"OpenWrt $DISTRIB_RELEASE by xiaowalu $kenzo_date\\"|" /usr/lib/os-release' package/lean/default-settings/files/zzz-default-settings
        sed -i '/sed -i .*DISTRIB_DESCRIPTION=/c\sed -i "s|^DISTRIB_DESCRIPTION=.*|DISTRIB_DESCRIPTION='\''OpenWrt $DISTRIB_RELEASE by xiaowalu $kenzo_date'\''|" /etc/openwrt_release' package/lean/default-settings/files/zzz-default-settings
        cp -f feeds/smpackage/.github/diy/banner package/base-files/files/etc/banner
        sed -i 's/by kenzo/by xiaowalu/g' package/base-files/files/etc/banner
        sed -i "s/%D %V, %C/openwrt $(date +'%m.%d') by xiaowalu/g" package/base-files/files/etc/banner
        sed -i 's#GO_PKG_TARGET_VARS.*# #g' feeds/packages/utils/v2dat/Makefile
        ./scripts/feeds install -a

        # LuCI 固件版本显示不自动追加 DISTRIB_REVISION
        sed -i 's/distversion = distversion \.\. " " \.\. distrevision/-- distversion = distversion .. " " .. distrevision/' \
          feeds/luci/modules/luci-lua-runtime/src/mkversion.sh

        # LuCI 状态页固件版本不显示 revision
        sed -i "s/boardinfo\.release\.revision ? boardinfo\.release\.revision : ''/''/" \
           feeds/luci/modules/luci-mod-status/htdocs/luci-static/resources/view/status/include/10_system.js

        # luci-light 默认主题依赖：Bootstrap -> Argon
        if [ -f feeds/luci/collections/luci-light/Makefile ]; then
             sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' \
                feeds/luci/collections/luci-light/Makefile
             echo "[PASS] luci-light 默认主题依赖设置为 Argon"
        else
             echo "[ERROR] 找不到 luci-light Makefile"
             exit 1
        fi

        make defconfig

    - name: SSH 远程配置固件
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ssh == 'true' }}
      uses: lexbritvin/ssh-session-action@v1
      with:
        use-bore: 'true'
        use-actor-ssh-keys: 'false'
        ssh-server-authorized-keys: ${{ secrets.SSH_PUBLIC_KEYS }}
        wait-timeout: '10800'
        
    - name: 恢复 OpenWrt 下载缓存
      id: restore-download-cache
      uses: actions/cache/restore@v4
      with:
        path: /mnt/openwrt/dl
        key: openwrt-dl-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('configs/Lean.config') }}
        restore-keys: |
          openwrt-dl-v1-${{ runner.os }}-${{ matrix.target }}-                  
        
    - name: 下载编译依赖包
      working-directory: ./openwrt
      run: |
        make download -j1 V=s

        if [ ! -s dl/erofs-utils-1.8.10.tar.gz ]; then
          echo "[ERROR] erofs-utils-1.8.10.tar.gz 下载失败"
          exit 1
        fi
        
        find dl -size -1024c -exec rm -f {} \;
    
    - name: 检查磁盘空间
      run: |
        df -hT
        du -sh openwrt/dl 2>/dev/null || true
        du -sh openwrt/build_dir 2>/dev/null || true
        du -sh openwrt/staging_dir 2>/dev/null || true

    - name: 编译 OpenWrt 固件
      working-directory: ./openwrt
      run: |
        echo -e "$(($(nproc)+1)) thread compile"
        make -j$(($(nproc)+1)) || make -j1 V=s

    - name: 保存 OpenWrt 下载缓存
      if: always() && !cancelled() && steps.restore-download-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: /mnt/openwrt/dl
        key: openwrt-dl-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('configs/Lean.config') }}

    - name: 整理固件文件
      id: organize
      if: success() && !cancelled()
      run: |
        mkdir -p firmware
        find openwrt/bin/targets -maxdepth 3 -type f \
          \( -name '*combined*' -o -name '*sysupgrade*' \) \
          -exec cp -f {} firmware/ \;
        if ! find firmware -maxdepth 1 -type f \
          \( -name '*combined*' -o -name '*sysupgrade*' \) | grep -q .; then
          echo "[ERROR] 未找到可发布的 OpenWrt 固件文件"
          echo "========== bin/targets 实际文件 =========="
          find openwrt/bin/targets -maxdepth 3 -type f -print
          exit 1
        fi
        cp openwrt/.config ./firmware/${{matrix.target}}.config 2>/dev/null || true
        cp openwrt/build_dir/target-*/linux-*/linux-*/.config ./firmware/${{matrix.target}}_kernel.config 2>/dev/null || true
        cd firmware
        echo "v${{ env.date2 }}" > version.txt
        rename -v "s/^openwrt/${{ env.VERSION }}-openwrt/" * || true
        rename -v "s/friendlyarm_//" *gz || true
        md5_output=$(md5sum *combined* *sysupgrade* 2>/dev/null || true)
        echo "$md5_output" >> version.txt
        echo ${{matrix.target}} >> version.txt
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 生成 Release 信息
      id: tag
      if: success() && !cancelled()
      run: |
        echo "OpenWrt Lean 固件" > release.txt
        echo "" >> release.txt
        echo "编译时间：${{ env.date }}" >> release.txt
        echo "编译目标：${{ matrix.target }}" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件到 GitHub Release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: "${{ env.FIRMWARE }}/*"
        name: ${{ env.date2 }} ${{matrix.target}}
        tag_name: ${{ env.date }}_${{matrix.target}}
        body_path: release.txt

    - name: 清理旧的 Actions 运行记录
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 5
        keep_minimum_runs: 0

    - name: 清理旧的 Releases
      uses: dev-drprasad/delete-older-releases@master
      if: success() && !cancelled()
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
