#=================================================
# GitHub Actions Web Terminal Test
# Purpose:
#   1. 独立测试 GitHub Runner 浏览器 Web Terminal
#   2. 不影响 Lean.yml
#   3. Web Terminal 退出后继续执行后续步骤
#=================================================

name: SSH Web Terminal Test

on:
  workflow_dispatch:
    inputs:
      web_terminal:
        description: '启动浏览器 Web Terminal'
        required: true
        type: boolean
        default: true

env:
  TZ: Asia/Shanghai

jobs:
  web-terminal-test:
    name: 测试浏览器 Web Terminal
    runs-on: ubuntu-latest

    # 防止忘记退出 Terminal 导致 Runner 长时间占用
    timeout-minutes: 30

    steps:

    #-------------------------------------------------
    # 1. Checkout 当前仓库
    #-------------------------------------------------
    - name: 检出仓库代码
      uses: actions/checkout@v4


    #-------------------------------------------------
    # 2. 显示 Runner 基本信息
    #-------------------------------------------------
    - name: 检查 GitHub Runner 环境
      run: |
        echo "=========================================="
        echo " GitHub Runner 信息"
        echo "=========================================="
        echo ""
        echo "当前用户:"
        whoami
        echo ""
        echo "主机名:"
        hostname
        echo ""
        echo "工作目录:"
        pwd
        echo ""
        echo "GitHub Workspace:"
        echo "$GITHUB_WORKSPACE"
        echo ""
        echo "CPU:"
        nproc
        echo ""
        echo "内存:"
        free -h
        echo ""
        echo "磁盘:"
        df -h
        echo ""
        echo "=========================================="


    #-------------------------------------------------
    # 3. 创建测试文件
    #
    # 等进入 Web Terminal 后，我们要确认可以看到此文件
    #-------------------------------------------------
    - name: 准备 Web Terminal 测试环境
      run: |
        echo "GitHub Web Terminal Test" > "$GITHUB_WORKSPACE/before-terminal.txt"
        echo "Created: $(date)" >> "$GITHUB_WORKSPACE/before-terminal.txt"

        echo ""
        echo "测试文件已经创建:"
        ls -lh "$GITHUB_WORKSPACE/before-terminal.txt"

        echo ""
        echo "仓库根目录:"
        ls -la "$GITHUB_WORKSPACE"


    #--------------------------------------
