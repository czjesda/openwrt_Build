name: SSH 测试

on:
  workflow_dispatch:

jobs:
  ssh-test:
    name: SSH 远程连接测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 显示 Runner 信息
        run: |
          echo "当前用户：$(whoami)"
          echo "当前目录：$(pwd)"
          echo "Runner 主机名：$(hostname)"
          uname -a

      - name: 启动 SSH 远程连接
        uses: lexbritvin/ssh-session-action@v1
        with:
          use-bore: 'true'
          use-actor-ssh-keys: 'true'
