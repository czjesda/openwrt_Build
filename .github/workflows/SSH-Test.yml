name: Web Terminal 测试

on:
  workflow_dispatch:

jobs:
  web-terminal-test:
    name: 浏览器 Web Terminal 测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 ttyd 和 cloudflared
        run: |
          sudo apt-get update
          sudo apt-get install -y ttyd curl

          curl -L \
            --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb

          echo "ttyd:"
          ttyd --version

          echo "cloudflared:"
          cloudflared --version

      - name: 启动浏览器终端
        run: |
          ttyd -W -p 7681 bash > /tmp/ttyd.log 2>&1 &
          echo $! > /tmp/ttyd.pid

          sleep 3

          curl --fail http://127.0.0.1:7681/ >/dev/null
          echo "ttyd 已启动"

      - name: 创建 Cloudflare 临时隧道
        run: |
          cloudflared tunnel \
            --url http://127.0.0.1:7681 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          echo $! > /tmp/cloudflared.pid

          echo "等待 Cloudflare 创建 Web Terminal 地址..."

          for i in {1..30}; do
            URL=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)

            if [ -n "$URL" ]; then
              echo ""
              echo "========================================"
              echo "Web Terminal 已启动"
              echo "$URL"
              echo "========================================"
              echo ""
              echo "打开上面的链接进入浏览器终端"
              exit 0
            fi

            sleep 2
          done

          echo "Cloudflare Tunnel 启动失败"
          cat /tmp/cloudflared.log
          exit 1

      - name: 等待 Web Terminal 操作完成
        run: |
          echo "浏览器终端正在运行"
          echo ""
          echo "测试完成后，在 Web Terminal 中执行："
          echo "touch /home/runner/end-session"
          echo ""

          for i in {1..180}; do
            if [ -f /home/runner/end-session ]; then
              echo "检测到结束标记，准备结束 Web Terminal"
              exit 0
            fi

            sleep 10
          done

          echo "Web Terminal 已达到 30 分钟超时"
