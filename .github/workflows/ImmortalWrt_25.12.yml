name: ImmortalWrt 25.12

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
   inputs:
    ssh:
      description: '是否进入 SSH 远程配置终端？选择 true 进入，false 跳过'
      required: true
      type: choice
      options:
        - 'false'
        - 'true'
      default: 'false'

env:
  TZ: Asia/Shanghai

jobs:
  merge:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id

    name: Build ${{matrix.target}}
    strategy:
      fail-fast: false
      matrix:
        target: [ImmortalWrt_25.12]
    
    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4

    - name: 释放磁盘空间
      uses: coder-xiaomo/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync swig unzip zlib1g-dev file wget \
        llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
        libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        
    - name: 获取当前日期
      run: |
        echo "date=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
        echo "date2=$(date +'%m/%d %Y')" >> $GITHUB_ENV
        echo "VERSION=$(date +'%m.%d')" >> $GITHUB_ENV       
        
    - name: 克隆源码
      env: 
        REPO_URL: https://github.com/immortalwrt/immortalwrt
        REPO_BRANCH: openwrt-25.12
      run: |
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        echo "========== ImmortalWrt source =========="
        git log -1 --oneline
        sed -i '$a src-git smpackage https://github.com/kenzok8/small-package' feeds.conf.default

    - name: 配置编译磁盘空间
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo mkdir -p -m 777 /mnt/openwrt/dl
        sudo chown -R $USER:$USER /mnt/openwrt
        ln -sf /mnt/openwrt/dl openwrt/dl

    - name: 更新软件源
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a

        echo "========== packages feed =========="
        git -C feeds/packages log -1 --oneline || true
        echo "========== luci feed =========="
        git -C feeds/luci log -1 --oneline || true
        echo "========== smpackage feed =========="
        git -C feeds/smpackage log -1 --oneline || true 
        
    - name: 生成编译配置 ${{matrix.target}}
      env:
        CONFIG_FILE: 'configs/ImmortalWrt_25.12.config'
      run: |
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "[ERROR] 找不到配置文件：$CONFIG_FILE"
          exit 1
        fi
        cp "$CONFIG_FILE" openwrt/.config

        chmod +x ./customize_immortalwrt_25.12.sh && ./customize_immortalwrt_25.12.sh
        cd openwrt
        rm -rf feeds/smpackage/{base-files,dnsmasq,firewall*,fullconenat,libnftnl,nftables,ppp,opkg,ucl,upx,vsftpd-alt,miniupnpd-iptables,wireless-regdb,nginx,luci-lib-ipkg}
        rm -rf feeds/packages/net/{alist,adguardhome,brook,chinadns-ng,dns2socks,dns2tcp,hysteria,ipt2socks}
        rm -rf feeds/packages/net/{lua-neturl,microsocks,naiveproxy,pdnsd-alt,redsocks2,simple-obfs,sing-box,ssocks,tcping,tuic-client}
        rm -rf feeds/packages/net/{gost,mosdns,redsocks*,smartdns,trojan*,v2ray*,xray*}	
        cp -f feeds/smpackage/.github/diy/default-settings package/emortal/default-settings/files/99-default-settings || true
        cp -f feeds/smpackage/.github/diy/banner package/emortal/default-settings/files/openwrt_banner || true
        cp -f feeds/smpackage/.github/diy/banner package/base-files/files/etc/banner
        cp -f feeds/smpackage/.github/diy/index_x86.htm package/emortal/autocore/files/generic/index.htm || true
        sed -i "s/%D %V, %C/openwrt $(date +'%m.%d') by kenzo/g" package/base-files/files/etc/banner
        ./scripts/feeds update -i && ./scripts/feeds install -a
        patch -p1 < feeds/smpackage/.github/diy/patches/001-dnsmasq-lxc-jail.patch
        cp -f feeds/smpackage/.github/diy/10_system.js feeds/luci/modules/luci-mod-status/htdocs/luci-static/resources/view/status/include/10_system.js || true
        make defconfig

    - name: SSH远程连接（交互配置）
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ssh == 'true' }}
      uses: owenthereal/action-upterm@v2.1.0
      timeout-minutes: 180
      with:
        limit-access-to-actor: true
        wait-timeout-minutes: 180
        
    - name: 禁用 Rust CI 的 LLVM 自动下载
      working-directory: ./openwrt
      run: |
        RUST_MAKEFILE="feeds/packages/lang/rust/Makefile"
        if [ -f "$RUST_MAKEFILE" ] && grep -q -- '--set=llvm\.download-ci-llvm=true' "$RUST_MAKEFILE"; then
          sed -i 's/--set=llvm\.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/' "$RUST_MAKEFILE"
          echo "[PASS] 已禁用 Rust CI LLVM 自动下载"
        else
          echo "[INFO] 当前 Rust Makefile 无需修改"
        fi

    - name: 恢复 ImmortalWrt 下载缓存
      id: restore-download-cache
      uses: actions/cache/restore@v4
      with:
        path: /mnt/openwrt/dl
        key: immortalwrt-25.12-dl-v1-${{ runner.os }}-${{ hashFiles('configs/ImmortalWrt_25.12.config') }}
        restore-keys: |
          immortalwrt-25.12-dl-v1-${{ runner.os }}-
          
    - name: 下载编译依赖包
      working-directory: ./openwrt
      run: |
        make download -j1 V=s
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      working-directory: ./openwrt
      run: |
        export GOROOT_BOOTSTRAP=$GOROOT_BOOTSTRAP
        echo -e "$(($(nproc)+1)) thread compile"
        make -j$(($(nproc)+1)) || make -j1 V=s      

    - name: 保存 ImmortalWrt 下载缓存
      if: always() && !cancelled() && steps.restore-download-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: /mnt/openwrt/dl
        key: immortalwrt-25.12-dl-v1-${{ runner.os }}-${{ hashFiles('configs/ImmortalWrt_25.12.config') }}
        
    - name: 检查磁盘空间
      if: (!cancelled())
      run: df -hT

    - name: 整理固件文件
      id: organize
      if: success() && !cancelled()
      run: |
        mkdir -p firmware
        find openwrt/bin/targets -maxdepth 3 -type f \
          \( -name '*combined*' -o -name '*sysupgrade*' \) \
          -exec cp -f {} firmware/ \;
        if ! find firmware -maxdepth 1 -type f \
          \( -name '*combined*' -o -name '*sysupgrade*' \) | grep -q .; then
          echo "[ERROR] 未找到可发布的 ImmortalWrt 固件文件"
          echo "========== bin/targets 实际文件 =========="
          find openwrt/bin/targets -maxdepth 3 -type f -print
          exit 1
        fi
        cp openwrt/.config ./firmware/ImmortalWrt_25.12.config 2>/dev/null || true
        cp openwrt/build_dir/target-*/linux-*/linux-*/.config ./firmware/${{matrix.target}}_kernel.config 2>/dev/null || true
        cd firmware
        echo "v${{ env.date2 }}" > version.txt
        rename -v "s/^immortalwrt/${{ env.VERSION }}-immortalwrt/" * || true
        rename -v "s/friendlyarm_//" *.gz 2>/dev/null || true
        md5_output=$(md5sum *combined* *sysupgrade* 2>/dev/null || true)
        echo "$md5_output" >> version.txt
        echo "${{ matrix.target }}" >> version.txt
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 生成Release 信息
      id: tag
      if: success() && !cancelled()
      run: |
        echo "ImmortalWrt 25.12 固件" > release.txt
        echo "" >> release.txt
        echo "编译时间：${{ env.date2 }}" >> release.txt
        echo "编译目标：${{ matrix.target }}" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件到GitHub Release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: "${{ env.FIRMWARE }}/*"
        name: ${{ env.date2 }} ${{matrix.target}}
        tag_name: ${{ env.date }}_${{matrix.target}}
        body_path: release.txt

    - name: 清理旧的Actions运行记录
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 5
        keep_minimum_runs: 0

    - name: 清理旧的Releases
      uses: dev-drprasad/delete-older-releases@master
      if: success() && !cancelled()
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
